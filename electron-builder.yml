appId: app.canvasforge.desktop
productName: Canvas Forge
copyright: Copyright © 2026 Canvas Forge contributors
directories:
  output: release
  buildResources: build
# Everything the app needs is bundled into dist/; node_modules are not shipped.
files:
  - dist/**
  - build/icon.png
  - package.json
  - '!**/*.map'
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Smaller download: strongest compression and only the English and German UI locales of Chromium.
compression: maximum
electronLanguages:
  - en-US
  - de
fileAssociations:
  - ext: cforge
    mimeType: application/x-canvas-forge
    name: Canvas Forge Document
    description: Canvas Forge document
    role: Editor
    icon: build/icon.ico
# Distributed as installers only: the NSIS setup on Windows and a .deb package on Linux. Both install
# the app with a Start menu / application menu entry, the .cforge association and an uninstaller.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # The executable's icon and version resources are set with rcedit (on Linux this needs Wine).
  # No code-signing certificate is configured, so the build is unsigned.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Canvas Forge
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Canvas Forge Setup ${version}.${ext}
linux:
  target:
    - deb
  category: Graphics
  maintainer: Canvas Forge contributors
  synopsis: Raster drawing and painting for pen tablets
  # Name the .desktop entry after package.json's desktopName so it matches the window's WM_CLASS.
  syncDesktopName: true
deb:
  artifactName: canvas-forge_${version}_${arch}.${ext}
appImage:
  artifactName: Canvas-Forge-${version}-linux-${arch}.${ext}
  compression: zstd
# Static AppImage runtime (does not depend on the system's libfuse2); also needed for zstd compression.
toolsets:
  appimage: '1.0.3'
