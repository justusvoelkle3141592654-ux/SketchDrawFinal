name: Canvas Forge Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest

    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $TAG"
            echo "Expected: v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

  test:
    name: Test application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable app
        run: npm run package:win

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*Setup*.exe" -File
          $portable = Get-ChildItem release -Filter "*Portable*.exe" -File

          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          if (-not $portable) {
            throw "Portable Windows executable was not generated."
          }

          $installer | ForEach-Object {
            Write-Host "Installer: $($_.Name)"
          }

          $portable | ForEach-Object {
            Write-Host "Portable: $($_.Name)"
          }

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: canvas-forge-windows
          path: |
            release/*Setup*.exe
            release/*Portable*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux application
        run: npm run package:linux-dir

      - name: Verify Linux application
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="release/linux-unpacked"
          EXECUTABLE="$APP_DIR/canvas-forge"

          if [ ! -d "$APP_DIR" ]; then
            echo "Linux application directory not found: $APP_DIR"
            exit 1
          fi

          if [ ! -f "$EXECUTABLE" ]; then
            echo "Linux executable not found: $EXECUTABLE"
            echo "Directory contents:"
            ls -la "$APP_DIR"
            exit 1
          fi

          chmod +x "$EXECUTABLE"

          echo "Linux executable found:"
          ls -lh "$EXECUTABLE"

      - name: Create Linux archive
        env:
          VERSION_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          ARCHIVE="Canvas-Forge-${VERSION_TAG}-linux-x64.tar.gz"

          tar -czf "release-artifacts/$ARCHIVE" \
            -C release linux-unpacked

          echo "Linux archive created:"
          ls -lh "release-artifacts/$ARCHIVE"

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: canvas-forge-linux
          path: release-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - validate
      - build-windows
      - build-linux

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: canvas-forge-windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: canvas-forge-linux
          path: artifacts/linux

      - name: Show release files
        run: find artifacts -type f -printf '%p (%s bytes)\n'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Canvas Forge ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.tar.gz
