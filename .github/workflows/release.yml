name: Canvas Forge Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $TAG"
            echo "Expected: v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "Validated release version: $VERSION"

  test:
    name: Test application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set package version from Git tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          npm version "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

          echo "Application version:"
          node -p "require('./package.json').version"

          echo "Lockfile version:"
          node -p "require('./package-lock.json').version"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set package version from Git tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          npm version "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

          echo "Building Canvas Forge $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable app
        run: npm run package:win

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*Setup*.exe" -File
          $portable = Get-ChildItem release -Filter "*Portable*.exe" -File

          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          if (-not $portable) {
            throw "Portable Windows executable was not generated."
          }

          $installer | ForEach-Object {
            Write-Host "Installer: $($_.Name)"
          }

          $portable | ForEach-Object {
            Write-Host "Portable: $($_.Name)"
          }

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: canvas-forge-windows
          path: |
            release/*Setup*.exe
            release/*Portable*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set package version from Git tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          npm version "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

          echo "Building Canvas Forge $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run package:linux-appimage

      - name: Verify Linux AppImage
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          FILES=(release/*.AppImage)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: No AppImage was generated."
            echo "Release directory contents:"
            find release -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p release-artifacts

          for FILE in "${FILES[@]}"; do
            echo "Found AppImage: $FILE"

            chmod +x "$FILE"
            cp "$FILE" release-artifacts/
          done

          echo "Generated Linux artifacts:"
          ls -lh release-artifacts/

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: canvas-forge-linux
          path: release-artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - validate
      - test
      - build-windows
      - build-linux

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: canvas-forge-windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: canvas-forge-linux
          path: artifacts/linux

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release artifacts:"
          find artifacts -type f -printf '%p (%s bytes)\n'

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          WINDOWS_INSTALLERS=(artifacts/windows/*Setup*.exe)
          WINDOWS_PORTABLES=(artifacts/windows/*Portable*.exe)
          LINUX_APPIMAGES=(artifacts/linux/*.AppImage)

          if [ "${#WINDOWS_INSTALLERS[@]}" -eq 0 ]; then
            echo "ERROR: Windows installer missing."
            exit 1
          fi

          if [ "${#WINDOWS_PORTABLES[@]}" -eq 0 ]; then
            echo "ERROR: Portable Windows application missing."
            exit 1
          fi

          if [ "${#LINUX_APPIMAGES[@]}" -eq 0 ]; then
            echo "ERROR: Linux AppImage missing."
            exit 1
          fi

          echo "All required release artifacts are present."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Canvas Forge ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.AppImage
